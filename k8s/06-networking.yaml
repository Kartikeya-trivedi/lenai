# Internal Networking (ClusterIP Services)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lenai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lenai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lenai
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: lenai
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lenai
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sd
  namespace: lenai
spec:
  selector:
    app: sd
  ports:
    - port: 7860
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: lenai
spec:
  selector:
    app: whisper
  ports:
    - port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro
  namespace: lenai
spec:
  selector:
    app: kokoro
  ports:
    - port: 8880
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: lenai
spec:
  selector:
    app: vllm
  ports:
    - port: 8000

# -----------------------------------------------------
# External Networking (Nginx deployment + Ingress)
# -----------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lenai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: lenai/nginx:latest # Contains the playground static files and custom nginx.conf
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: lenai
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP # Change to LoadBalancer if not using an Ingress Controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lenai-ingress
  namespace: lenai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod" # Uncomment if using cert-manager
spec:
  # ingressClassName: nginx
  rules:
    - host: api.yourdomain.com # Change this
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
